schema_version: '1.0'
stages:
  W0:
    programme_section: 5
    required_reading:
      - [docs/context/input_contract.md, 'объекты, паспорта, обозначения и происхождение']
      - [docs/context/mathematical_core.md, 'формулы, Hill-нормировка и события, подлежащие аудиту']
      - [docs/data_dictionary.md, 'контракт параметров и исходных состояний']
    inputs: >-
      До любых веб-поисков проверить локальный полный комплект статьи
      [arXiv-2609.03564v1](../../arXiv-2609.03564v1/): [исходник статьи](../../arXiv-2609.03564v1/aa57101-25.tex),
      [метаданные комплекта](../../arXiv-2609.03564v1/00README.json), библиографию, LaTeX-класс/стиль
      и все подключённые PDF-рисунки. Это локальные научные исходники публикации, а не динамический код
      исследования; код проекта находится в src/submoon_research. Веб-поиск не повторять для материалов,
      уже имеющихся локально; использовать его только если установлен конкретный отсутствующий материал.
      Сведения исходной программы подлежат проверке по статье, приложениям, коду при доступности,
      первичным параметрам и геометрическим состояниям.
    steps:
      - 'Сначала описать и проверить локальный комплект arXiv-2609.03564v1, сверить версию, полный TeX, библиографию и подключённые файлы; зарегистрировать SHA-256 и пробелы. Не выполнять дублирующий веб-поиск; обращаться к сети только за явно отсутствующим материалом. Выполнить W0-001.'
      - 'Проверить фактические формулы и входы: Hill, массы, плотности, пробное тело, J2, эпоха/оси и события; заполнить baseline_audit.csv.'
      - 'Заполнить паспорта Япета, Ганимеда и Гималии с источниками, единицами и совместными неопределённостями.'
      - 'Выполнить малый запрос геометрических состояний, сохранить ответ и SHA; проверить origin/frame/time_scale.'
      - 'Определить L1 и воспроизводимые начальные состояния; подготовить малый базовый ансамбль для проверенного численного маршрута.'
      - 'Разобрать расхождения и остаточные неоднозначности; точное и независимое воспроизведение обозначить раздельно.'
    outputs: 'Паспорта configs/hosts; source_manifest и datasets; baseline_audit.csv; версия L1; стартовые состояния; отчёт W0 с влиянием каждой несогласованности.'
    handoff: 'W1 получает проверяемые области и параметры; W2 — явную постановку и базовые старты. Необъяснённые единицы и нормировки в основные расчёты не передаются.'
  W1:
    programme_section: 6
    required_reading:
      - [docs/context/mathematical_core.md, 'полная спецификация мер, весов, ошибок, событий и знаменателей']
      - [docs/context/scientific_rules.md, 'контрольные сравнения и ограничения интерпретации']
      - [docs/validation_protocol.md, 'freeze, независимость и проектные пороги']
    inputs: 'Паспорта и области W0; исходная сетка отдельно; гипотезы H1–H3, список хозяев и доступные численные ограничения. Протокол можно разрабатывать до завершения W0, фиксировать после проверки входов.'
    steps:
      - 'Определить первичные показатели, семейство сравнений, горизонты и практически значимые эффекты.'
      - 'Специфицировать основные и альтернативные меры, условную область и нормировку; обработать вырожденные орбитальные элементы.'
      - 'Реализовать и проверить генераторы, веса, страты, seeds и независимые рандомизации; отделить внешние сценарии от внутренних стартов.'
      - 'Выбрать интервалы разностей, учёт ковариации и множественных сравнений, правила остановки/исключений/аварий.'
      - 'Подготовить план точности и стоимости пилота; обосновать изменения стартовых 8×256.'
      - 'Зафиксировать H1–H3, альтернативы, split и количественные предсказания до просмотра проверочных исходов.'
    outputs: 'Версионированные sampling-конфиги, генератор и его проверки, протокол показателей/интервалов/остановки, план точности, predictions и таблица решений H1–H3.'
    handoff: 'W2 и W3 получают воспроизводимую выборку с однозначными знаменателями. Freeze и научная независимость подтверждаются конкретными версиями и временем регистрации.'
  W2:
    programme_section: 7
    required_reading:
      - [docs/context/mathematical_core.md, 'силы, координаты, события и статистические ограничения']
      - [docs/context/reproducibility.md, 'минимальная запись расчёта и сквозной проверочный выпуск']
      - [docs/validation_protocol.md, 'проверки V01–V11 и критерии точности']
    inputs: 'Паспорта и базовые старты W0, дизайн W1, явные L0–L2 уравнения, независимые реализации контрольных сил. Имеющийся круговой smoke закрывает только узкую инфраструктурную проверку.'
    steps:
      - 'Проверить двухтельные пределы, эксцентрические проходы, CR3BP и доступные интегралы.'
      - 'Проверить силы, градиент потенциала, J2-прецессию и преобразования систем координат.'
      - 'Проверить контакт между шагами, временный выход/возврат, критерии ухода и неоднозначные исходы.'
      - 'Сравнить независимые методы и уточнение допусков: сначала траектории, после хаотического расхождения распределения.'
      - 'Реализовать и проверить checkpoint, прерывание/рестарт, исходы/веса и сквозной малый выпуск.'
      - 'Измерить распределение CPU/wall/I/O стоимости, тяжёлый хвост и повторы; обосновать рабочие режимы и объём W3.'
    outputs: 'Тесты физических пределов, таблицы сходимости и событий, проверка рестарта, малый открытый сквозной пример, отчёт стоимости и допустимые численные режимы.'
    handoff: 'W3 запускается только после закрытия существенных ошибок и измеренного бюджета. Если целевая точность недостижима, заранее сузить научный вопрос решением.'
  W3:
    programme_section: 8
    required_reading:
      - [docs/context/mathematical_core.md, 'оцениваемые величины и пять источников неопределённости']
      - [docs/context/scientific_rules.md, 'обязательные контрольные сравнения и допустимые выводы']
      - [docs/context/reproducibility.md, 'полная запись серии и восстановимость продуктов']
    inputs: 'Проверенные L2, паспорта W0, генератор и frozen-дизайн W1, точность/стоимость W2; десять хозяев либо обоснованное заранее сужение. Отдельная L1-серия для сопоставления с исходной работой.'
    steps:
      - 'Зафиксировать производственные серии, горизонты, ресурсы и правила обработки неразрешённых исходов.'
      - 'Создать независимую оценочную выборку; отдельно хранить адаптивное уточнение и стратифицированные продолжения.'
      - 'Варьировать внешние фазы согласованными состояниями массивных тел; не разрушать архитектуру независимыми перестановками.'
      - 'Выполнить серии с checkpoint и provenance, контролировать ошибки и стоимость.'
      - 'Оценить S, конкурирующие F_k, разности хозяев, зависимость от меры/фаз/критерия ухода и неразрешённую долю.'
      - 'Выполнить отложенную проверку и ограниченный механизм W4; построить воспроизводимые карты и таблицы.'
    outputs: 'Каталоги исходов, атлас, кривые выживания/потерь, интервалы разностей, sensitivity, контрольная группа, evidence claims и генераторы рисунков.'
    handoff: 'W4 получает проверяемые границы и диагностические случаи; W5 и W7 — допустимые области. Первая статья требует нового сравнительного вывода, точности и физической интерпретации.'
  W4:
    programme_section: 9
    required_reading:
      - [docs/context/mathematical_core.md, 'уровни модели, единицы и определения потерь']
      - [docs/context/scientific_rules.md, 'парные контрольные эксперименты и независимая проверка']
      - [docs/validation_protocol.md, 'проверка фигуры, сил и предсказаний']
    inputs: 'Проверенные карты/траектории W3 и аппарат W2; гармоники, их нормировка, ось, вращение, форма и прочность с источниками. Малый пилот возможен до полного атласа.'
    steps:
      - 'Выбрать информативные случаи, начиная с качества данных Ганимеда/Реи; обозначить неизвестные поля сценариями.'
      - 'Проверить потенциал и ускорения J2/C22, ориентацию, отсутствие удвоения монополя и область сходимости.'
      - 'На одинаковых стартах сравнить точечный хозяин, J2, тессеральное поле и вращение.'
      - 'Измерить частоты и резонансные углы, либрацию/сепаратрисы и реакцию на контролируемые изменения.'
      - 'Отделить контакт, прочностное разрушение и условный Roche; проверить физическую внутреннюю границу.'
      - 'Сформулировать количественное предсказание и проверить на новых случаях; измерить эффект либо верхний предел.'
    outputs: 'Парные исходы, частоты/углы, атрибуция механизмов, область применимости точечной модели, физическая внутренняя граница и независимые предсказания.'
    handoff: 'W5 получает обоснованные механизмы и режимы; W10 — объяснимые безразмерные связи. Не объявлять механизм по одной полосе MEGNO.'
  W5:
    programme_section: 10
    required_reading:
      - [docs/context/mathematical_core.md, 'условная выживаемость и системные допущения']
      - [docs/context/scientific_rules.md, 'контрольные эксперименты и пределы экстраполяции']
      - [docs/context/reproducibility.md, 'состояния, спин и запись длинных исполнений']
    inputs: 'Области W3–W4, параметры поля/приливов/тепла/формы, диапазоны неопределённостей и проверенные локальные динамические режимы.'
    steps:
      - 'Выбрать один-два хозяина и конкурирующих механизма по значимости; определить физические сценарии и размеры.'
      - 'Реализовать согласованные приливные и тепловые модели, спин и обратную реакцию; проверить знаки и балансы.'
      - 'Различить радиационное давление, тепловые эффекты и вращательные режимы; не назначать постоянный дрейф на весь возраст.'
      - 'Калибровать усреднённую схему прямым N-body; сохранять нужные углы при резонансах.'
      - 'Проверить переключения, непрерывность, ошибку ускорения и совместимость вариационных уравнений.'
      - 'Увеличивать горизонт ступенчато; оценить условные времена жизни и влияние неизвестных историй.'
    outputs: 'Карты режимов и условных времён жизни, ядра переходов, ошибка ускорения, sensitivity к физическим параметрам и перечень неразрешимых режимов.'
    handoff: 'W6–W8 получают проверенные переходные ядра с ограничениями. Геологический горизонт допускается только внутри подтверждённой области модели.'
  W6:
    programme_section: 11
    required_reading:
      - [docs/context/scientific_rules.md, 'ограничения популяционной интерпретации']
      - [docs/context/reproducibility.md, 'происхождение параметров и сохранение продуктов']
    inputs: 'Карты/переходы W3–W5; опубликованные потоки ударников, свойства поверхности, скоростно-размерные распределения и история хозяина с неопределённостью.'
    steps:
      - 'Определить транспортную модель с источником, потерями и перераспределением без двойного учёта.'
      - 'Начать с параметрического ударного выброса, согласованного с первичными моделями; измерить удержание.'
      - 'Проверять захват как отдельный канал с механизмом обмена энергией или диссипации.'
      - 'Рассчитать столкновительное разрушение с правильным определением потока, сечения и порога.'
      - 'Проверить балансы массы/момента, sensitivity и ограничиваемость нормировки.'
      - 'Если нормировка неизвестна, завершить условными ядрами; дорогую физику запускать только при доказанной необходимости.'
    outputs: 'Ядра рождения и удержания, времена разрушения по размеру, балансы, диапазоны нормировки либо явное указание её неидентифицируемости.'
    handoff: 'W8 получает только обоснованные источники или условные семейства; отсутствие нормировки не подменять произвольным абсолютным числом тел.'
  W7:
    programme_section: 12
    required_reading:
      - [docs/context/input_contract.md, 'эпохи, системы отсчёта, источники и геометрия']
      - [docs/context/scientific_rules.md, 'слепые инъекции и допустимость наблюдательных выводов']
      - [docs/validation_protocol.md, 'независимые серии, freeze и ложные тревоги']
    inputs: 'Архивные кадры, калибровки, геометрия, маски/PSF/экспозиции и допустимые орбитальные шаблоны. Инвентаризация возможна параллельно W0–W3.'
    steps:
      - 'Выбрать один инструмент и хозяина по фактической пригодности, покрытию, фону и калибровке.'
      - 'Зарегистрировать файлы и разделить наблюдательные серии для настройки и окончательной проверки.'
      - 'Реализовать фон, движение за экспозицию, PSF, шум и геометрию; проверить применимость накопления.'
      - 'Провести слепые инъекции, отрицательные контроли и оценку глобальной ложной тревоги.'
      - 'Проверить кандидатов в независимых данных; получить полноту и инструментальные пределы потока.'
      - 'Перевести пределы в условные классы объектов/радиусы и сравнить с прежними ограничениями перед расширением.'
    outputs: 'Манифест кадров, воспроизводимая обработка, полнота, ложные тревоги, протокол кандидатов или верхние пределы и требования к новым наблюдениям.'
    handoff: 'W8 получает наблюдательный оператор и неопределённости. Тысячи кадров одного хозяина не считаются тысячами независимых хозяев; слабая полнота не доказывает пустоту.'
  W8:
    programme_section: 13
    required_reading:
      - [docs/context/scientific_rules.md, 'проверка объяснений и ограничения научных выводов']
      - [docs/validation_protocol.md, 'искусственные каталоги и независимые проверки']
    inputs: 'Проверенные источники W6, переходные ядра W3–W5, полнота/кандидаты W7 и неопределённости всех частей. Наличие текста этих этапов не заменяет их результатов.'
    steps:
      - 'Согласовать источник, эволюцию с потерями и наблюдательный оператор в одной размерной постановке.'
      - 'Проверить нормировки likelihood и отсутствие двойного учёта полноты; обосновать модель зависимостей.'
      - 'Сгенерировать искусственные каталоги и выявить восстанавливаемые комбинации/вырождения.'
      - 'Проверить интервальное покрытие, priors, нулевые результаты и ошибку суррогатной динамики.'
      - 'Применить к реальным данным и проверить предсказания отложенных хозяев.'
      - 'Опубликовать идентифицируемые комбинации и выбрать дополнительные измерения по ожидаемой информативности.'
    outputs: 'Проверенная совместная модель, ограничения на параметры/комбинации, карта вырожденностей, предсказания и приоритет новых данных.'
    handoff: 'Собственные выводы ограничены идентифицируемостью и чувствительностью к priors; отсутствие находок не разделяет автоматически рождение, выживание и обнаружение.'
  W9:
    programme_section: 14
    required_reading:
      - [docs/context/scientific_rules.md, 'сравнение сценариев и пределы вывода о происхождении']
      - [docs/context/reproducibility.md, 'открытая запись моделей и входов']
    inputs: 'Независимые геологические ограничения хребта, история вращения Япета, опубликованные сценарии диска/массивного субспутника и подходящие результаты W4–W6.'
    steps:
      - 'Сформулировать новое различающее предсказание и собрать независимые геологические ограничения.'
      - 'Разделить сценарий внутреннего кольца с внешним спутником и отложенное разрушение приливно эволюционирующего тела.'
      - 'Воспроизвести опубликованный упрощённый путь с явными параметрами и балансами.'
      - 'Варьировать массу, момент, спин, ориентацию и диссипацию; рассчитать осаждение либо эволюцию фрагментов.'
      - 'Сопоставить одновременно геометрию, массу, возраст и сохранность; учесть время образования.'
      - 'Оценить области совместимости и измерения, способные различить сценарии.'
    outputs: 'Сравнение самостоятельных сценариев, области совместимости с несколькими ограничениями и новое различающее предсказание.'
    handoff: 'Самостоятельное расширение; не выводить происхождение хребта из текущего рейтинга 100-метровых тел или одной подходящей траектории.'
  W10:
    programme_section: 15
    required_reading:
      - [docs/context/mathematical_core.md, 'определения безразмерных масштабов и мер']
      - [docs/context/scientific_rules.md, 'независимые системы и границы переносимости']
      - [docs/validation_protocol.md, 'split по хозяевам и фиксация предсказаний']
    inputs: 'Подтверждённые механизмы W4, атлас W3, при необходимости времена W5 и отложенные хозяева с проверенными параметрами.'
    steps:
      - 'Выбрать физически мотивированные безразмерные параметры и область применения.'
      - 'Построить простой аналитический предсказатель и изучить остатки до гибкой модели.'
      - 'Зафиксировать разделение по хозяевам и новые предсказания; соседние траектории не считать внешним тестом.'
      - 'Проверить калибровку, границы режимов, ошибку переноса и признаки выхода за область обучения.'
      - 'При провале выделить недостающий параметр или иной режим; при необходимости выполнить новый прямой расчёт.'
      - 'Опубликовать формулу/суррогат с ошибкой, областью применимости и правилами отказа от точного прогноза.'
    outputs: 'Интерпретируемый предсказатель, ошибки на новых хозяевах, каталог режимов и случаев обязательного прямого расчёта.'
    handoff: 'Успешный перенос относится к испытанной области; применение к гипотетическим экзолунам не подтверждает их существование.'
