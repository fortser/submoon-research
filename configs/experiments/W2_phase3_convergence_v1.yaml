# Уточнение §2.4 при freeze (до любых новых расчётов): ранние события почти у всех орбит,
# поэтому для терминальных исходов берётся самая долгоживущая согласная орбита.
controls:
  source: "144 единицы B144 на 1000 лет; исключены цели и отложенные"
  agreement: "одинаковая метка нового B (B144), D и T (P2-2a), не unresolved; для контакта/ухода max-min времени трёх методов <= 1 P0"
  cost_cap_b_wall_seconds: 300.0   # wall нового B в B144 (9975WX)
  pick_terminal: "наибольшее время события, затем наименьший номер единицы"
  pick_survived: "наименьший wall нового B, затем наименьший номер единицы"
  codes: [D, Ds, T, Ts, U, B]       # без Bs/Be (цена); любой сдвиг метки — правило 4
  perturbed_controls: "по одному на исход (контакт, уход, survived): терминальные — наибольшее время события среди выбранных, survived — наименьший wall B"

perturbation:
  directions: ["+R", "-R", "+T", "-T", "+N", "-N", I0, I1, I2, I3]   # R, T, N — смещение положения; I* — изотропно в 6D (r/a0, v/(n0 a0))
  isotropic_seed: 20261026
  scales: [1.0e-12, 1.0e-10, 1.0e-8]
  horizon_years: 1000.0

thresholds:
  divergence: [1.0e-9, 1.0e-6, 1.0e-3, 1.0e-1]   # max(|dr|/a0, |dv|/(n0 a0)) на общей сетке
  event_time_tight_p0: 1.0e-6
  event_time_p0: 1.0                              # «совпадение» времени для сходимости и согласия семейств
  contraction: 0.1                                # |dt| финальной пары <= 0.1 |dt| предыдущей (или <= tight)
  sigma_num_window_years: 1.0                     # σ_num — max Δ двух самых точных ступеней DOP853 при t <= 1 года
  sensitive_scale_floor: 1.0e-10                  # s* = max(1e-10, 10 σ_num)
  k2_event_margin_p0: 10.0
  k3_min_directions: 2
  k3_time_spread_p0: 10.0
  # Классы применяются в порядке К0 → К2 → К1 → К3 → К4 (уточнения при freeze): К0 — грубая
  # ступень совпадает со сошедшимся пределом (архивное расхождение здесь не воспроизвелось;
  # не считается ни К1, ни подтверждением); пересечение К1/К2 трактуется как чувствительность
  # события, а не как ошибка траектории.

decision_rules:
  - "1. Есть не-high-e цель К1 с ошибочным D и верным T, и нет К1 с ошибочным T -> кандидат P2-2b: T (или гибрид от T)"
  - "2. Есть К1 с ошибочным T -> ни D, ни T как есть; кандидат Ts/U с измерением цены"
  - "3. Все не-high-e цели К2/К3 (допускаются К0, но не все К0) -> выбор D/T по распределительному тесту P2-2b; К2 -> Фаза 4"
  - "4. Любой контроль меняет метку на лестнице -> issue, пересмотр плана P2-2b"
  - "5. Bs/Be меняют метку 0011 или 0013 -> B (epsilon 1e-9) не сошедшийся контроль; Фаза 2 на уточнённом B"

budget:
  block_wall_hours_max: 3.0      # блок должен закончиться днём; deadline и stop-file обязательны
  total_hours_warn: 5.0          # выше — сужение, затем предложение аренды (AGENTS.md)
  b_fallback_rule: "если бенчмарк предсказывает wall B для ganymede:canonical_volume:0126 на 1000 лет > 2 ч на этом ПК, B-ступени этой единицы считаются до 400 лет с пометкой"
