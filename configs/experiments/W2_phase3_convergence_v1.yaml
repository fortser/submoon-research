# Лестница по одному фактору. D = NumericMode(), T = NumericMode.tight(), B = NumericMode()
# (как P2-2a/B144); остальные отличаются от соседней ступени одним полем.
modes:
  D:  {family: dop853, rtol: 1.0e-11, atol_position: 1.0e-8,  atol_velocity: 1.0e-11, step_fraction: 0.025,   epsilon: 1.0e-9,  cache_epsilon: 1.0e-12}
  Ds: {family: dop853, rtol: 1.0e-11, atol_position: 1.0e-8,  atol_velocity: 1.0e-11, step_fraction: 0.0125,  epsilon: 1.0e-9,  cache_epsilon: 1.0e-12}
  T:  {family: dop853, rtol: 1.0e-13, atol_position: 1.0e-10, atol_velocity: 1.0e-13, step_fraction: 0.0125,  epsilon: 1.0e-12, cache_epsilon: 1.0e-13}
  Ts: {family: dop853, rtol: 1.0e-13, atol_position: 1.0e-10, atol_velocity: 1.0e-13, step_fraction: 0.00625, epsilon: 1.0e-12, cache_epsilon: 1.0e-13}
  U:  {family: dop853, rtol: 1.0e-14, atol_position: 1.0e-11, atol_velocity: 1.0e-14, step_fraction: 0.00625, epsilon: 1.0e-12, cache_epsilon: 1.0e-13}
  B:  {family: ias15,  rtol: 1.0e-11, atol_position: 1.0e-8,  atol_velocity: 1.0e-11, step_fraction: 0.025,   epsilon: 1.0e-9,  cache_epsilon: 1.0e-12}
  Bs: {family: ias15,  rtol: 1.0e-11, atol_position: 1.0e-8,  atol_velocity: 1.0e-11, step_fraction: 0.0125,  epsilon: 1.0e-9,  cache_epsilon: 1.0e-12}
  Be: {family: ias15,  rtol: 1.0e-11, atol_position: 1.0e-8,  atol_velocity: 1.0e-11, step_fraction: 0.025,   epsilon: 1.0e-10, cache_epsilon: 1.0e-12}
ladders:
  dop853: [D, Ds, T, Ts, U]
  ias15: [B, Bs, Be]

horizon_years: 1000.0
grid:
  dense_step_p0: 0.05          # равномерная плотная сетка [0, min(окно, H, dense_max_points·шаг)] с шагом 0.05 P0
  dense_max_points: 40000      # предел памяти: у Ганимеда (P0 < 1 сут) окно ≈ 2000 P0 вместо 50 лет
  log_points: 200              # плюс 200 точек geomspace(1e-5 H, H); полное состояние всех тел — в этих точках
  log_start_fraction: 1.0e-5
  perturbation_dense: false    # возмущённые задания — только логарифмическая сетка (исход, время, τ)
dense_window_years_default: 50.0

# Целевые случаи (§2.1 плана). high_e: исход DOP853 в архиве не определён (high-e unresolved),
# поэтому класс определяется по IAS15 с уверенностью не выше «средней».
targets:
  - {orbit_id: "iapetus:uniform_a_e_cos_i_phases:0011", block: P0, high_e: true,  codes: [D, Ds, T, Ts, U, B, Bs, Be], perturb_family: B}
  - {orbit_id: "himalia:canonical_volume:0013",         block: P0, high_e: true,  codes: [D, Ds, T, Ts, U, B, Bs, Be], perturb_family: B}
  - {orbit_id: "iapetus:canonical_volume:0006",         block: P0, high_e: false, codes: [D, Ds, T, Ts, U, B, Bs, Be], perturb_family: Ts, dense_window_years: 30.0}
  - {orbit_id: "himalia:canonical_volume:0012",         block: P1, high_e: false, codes: [D, Ds, T, Ts, U, B, Bs, Be], perturb_family: Ts}
  - {orbit_id: "himalia:uniform_a_e_cos_i_phases:0097", block: P1, high_e: false, codes: [D, Ds, T, Ts, U, B, Bs, Be], perturb_family: Ts}
  - {orbit_id: "ganymede:uniform_log_a:0086",           block: P1, high_e: false, codes: [D, Ds, T, Ts, U, B, Bs, Be], perturb_family: Ts}
  - {orbit_id: "ganymede:canonical_volume:0126",        block: P1, high_e: false, codes: [D, Ds, T, Ts, U, B, Bs, Be], perturb_family: Ts, b_horizon_fallback_years: 400.0}
  - {orbit_id: "himalia:uniform_a_e_cos_i_phases:0012", block: P1, high_e: false, codes: [D, Ds, T, Ts, U],             perturb_family: Ts}

