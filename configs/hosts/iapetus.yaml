open_questions:
- Погрешность радиуса в Thomas (2010) дана как 2sigma; Table 5 Jacobson (2022) воспроизводит то же число с общей пометкой 1sigma. Приоритет у первичного измерения; конфликт зарегистрирован отдельно.
- Совместная ковариация GM, формы и состояний не получена; независимое варьирование не разрешено.
- Эпоха, шкала времени и оси независимых геометрических состояний задаются отдельным контрактом W0-002.
- Коэффициенты фигуры в SAT441 включают модельные допущения; не считать их измеренным полем Япета без отдельного аудита L3/W4.
- Контактная поверхность и топография требуют решения; 718 km из архивного входа не приняты как средний объёмный радиус нового пилота.
