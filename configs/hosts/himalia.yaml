open_questions:
- Sigma и совместная ковариация JUP344 не получены; большая ошибка GM ~38% из сводки не является назначенным распределением.
- 85 км — компиляция IAU; первичный Cruikshank 1977 не получен. Тепловой размер и Cassini не определяют объём и контактную
  границу.
- Предварительные покрытия звёзд 2018 обсуждаются в EPSC-DPS2019-1909; размеры проекции не приняты как глобальная форма без
  первичного полного анализа.
- Период вращения, полюс, поле и геометрические состояния требуют отдельного аудита.
