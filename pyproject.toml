[build-system]
requires = ["setuptools>=63", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "submoon-research"
version = "0.3.0"
description = "Reproducible research workspace for submoon dynamics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy", "astropy", "scipy", "sympy", "rebound", "matplotlib",
  "pandas", "pyarrow", "PyYAML", "pydantic>=2", "mpmath>=1.3",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
geometry = ["spiceypy"]
observations = ["photutils", "reproject", "scikit-image", "pvl", "pds4_tools"]
extended_physics = ["reboundx"]
inference = ["emcee", "arviz"]

[project.scripts]
submoon = "submoon_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"submoon_research.contracts" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
